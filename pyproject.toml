[project]
name = "plat-rand"
version = "1.0.0"
description = "Nuzlocke randomizer for Pokémon Platinum / Renegade Platinum"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["ndspy>=4.1.0"]

[project.scripts]
plat-rand = "plat_rand.cli:run_cli"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["plat_rand*"]
